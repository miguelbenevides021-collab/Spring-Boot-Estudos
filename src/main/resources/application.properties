spring.application.name=authteste3
spring.datasource.url=jdbc:postgresql://localhost:5432/authteste3
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Chave secreta que assina os tokens. NÃO escreva a chave aqui:
# ela vem de uma variável de ambiente chamada JWT_SECRET
jwt.secret=${JWT_SECRET}

# Tempo de vida do token em milissegundos (3600000 = 1 hora)
jwt.expiration-ms=3600000

